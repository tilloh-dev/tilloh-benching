<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>BenchyOS model renderer</title>
		<style>
			html,
			body {
				margin: 0;
				background: #0b1230;
				overflow: hidden;
			}
			canvas {
				display: block;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "/vendor/three/build/three.module.js",
					"three/addons/": "/vendor/three/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<script type="module">
			import * as THREE from 'three';
			import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
			import { STLLoader } from 'three/addons/loaders/STLLoader.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

			const params = new URLSearchParams(location.search);
			const file = params.get('file');
			const format = (params.get('format') || file.split('.').pop()).toLowerCase();
			window.__benchy = { ready: false, error: null, stats: null };

			const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
			renderer.setSize(innerWidth, innerHeight);
			renderer.setPixelRatio(1);
			document.body.appendChild(renderer.domElement);
			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x0b1230);
			scene.add(new THREE.HemisphereLight(0xe8ecff, 0x1b2759, 1.1));
			const key = new THREE.DirectionalLight(0xffffff, 1.6);
			key.position.set(3, 5, 4);
			scene.add(key);
			const rim = new THREE.DirectionalLight(0xffd23f, 0.7);
			rim.position.set(-4, 2, -3);
			scene.add(rim);
			const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.001, 1e6);

			const material = new THREE.MeshStandardMaterial({
				color: 0xc9d2ff,
				roughness: 0.55,
				metalness: 0.1,
				side: THREE.DoubleSide,
				flatShading: false
			});

			function load() {
				return new Promise((resolve, reject) => {
					const onErr = (e) => reject(new Error(e?.message || String(e)));
					if (format === 'obj') new OBJLoader().load(file, resolve, undefined, onErr);
					else if (format === 'stl')
						new STLLoader().load(
							file,
							(g) => resolve(new THREE.Mesh(g, material)),
							undefined,
							onErr
						);
					else if (format === 'ply')
						new PLYLoader().load(
							file,
							(g) => {
								g.computeVertexNormals();
								resolve(new THREE.Mesh(g, material));
							},
							undefined,
							onErr
						);
					else if (format === 'gltf' || format === 'glb')
						new GLTFLoader().load(file, (g) => resolve(g.scene), undefined, onErr);
					else reject(new Error('unsupported format ' + format));
				});
			}

			let views = [];
			try {
				const object = await load();
				let vertices = 0,
					triangles = 0,
					meshes = 0;
				object.traverse((o) => {
					if (o.isMesh) {
						meshes++;
						const g = o.geometry;
						if (!g.attributes.normal) g.computeVertexNormals();
						if (format !== 'gltf' && format !== 'glb') o.material = material;
						vertices += g.attributes.position?.count ?? 0;
						triangles += g.index ? g.index.count / 3 : (g.attributes.position?.count ?? 0) / 3;
					}
				});
				scene.add(object);
				const box = new THREE.Box3().setFromObject(object);
				const size = box.getSize(new THREE.Vector3());
				const center = box.getCenter(new THREE.Vector3());
				const radius = Math.max(size.length() / 2, 1e-6);
				const dist = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.05;
				const grid = new THREE.GridHelper(radius * 4, 20, 0x2a3a7a, 0x1b2759);
				grid.position.set(center.x, box.min.y, center.z);
				scene.add(grid);
				const dirs = {
					front: [0, 0.15, 1],
					side: [1, 0.15, 0],
					top: [0.001, 1, 0.001],
					iso: [1, 0.8, 1]
				};
				views = Object.entries(dirs).map(([name, d]) => ({
					name,
					pos: new THREE.Vector3(...d).normalize().multiplyScalar(dist).add(center)
				}));
				window.__view = (i) => {
					const v = views[i];
					camera.position.copy(v.pos);
					camera.lookAt(center);
					camera.near = dist / 100;
					camera.far = dist * 100;
					camera.updateProjectionMatrix();
					renderer.render(scene, camera);
					return v.name;
				};
				window.__benchy = {
					ready: true,
					error: null,
					stats: {
						meshes,
						vertices,
						triangles: Math.round(triangles),
						bbox: { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray() },
						empty: vertices === 0 || !Number.isFinite(radius)
					},
					views: views.map((v) => v.name)
				};
				window.__view(3);
			} catch (e) {
				window.__benchy = { ready: true, error: String(e?.message || e), stats: null };
			}
		</script>
	</body>
</html>
