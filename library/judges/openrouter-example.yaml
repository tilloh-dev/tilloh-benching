id: openrouter-example
label: OpenRouter judge (example)
description: A second opinion from a non-Claude model via any OpenAI-compatible API. Static only; screenshots are sent as images.
kind: openai-compatible
model: google/gemini-3-pro
endpoint:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
request:
  temperature: 0
images: true
